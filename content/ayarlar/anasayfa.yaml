manifesto:
  title: Her bedende doğru seçim mümkün
  text: Doğru beden, doğru kalıp ve doğru kumaş bir araya geldiğinde giyinmek kolaylaşır. Rehberlerimiz ölçüden başlar, markaların kendi tablolarına dayanır ve satış yapmaz.

hero:
  title: Türkiye'nin büyük beden moda ve stil rehberi
  lead: Beden, kalıp, kumaş, stil ve kombin sorularınıza kaynaklı ve anlaşılır cevaplar.
  kadin:
    title: Büyük Beden Kadın Giyim
    text: Stil, konfor ve özgüven bir arada
    cta: Kadın Bölümüne Git
    image:
      src: /images/ai/hero-kadin/hero-kadin.jpg
      alt: "Büyük beden kadın günlük kombini: kiremit rengi kruvaze midi elbise, omuzda bej trençkot ve ten rengi babetlerle İstanbul'da taş döşeli bir sokakta"
      aiGenerated: true
  erkek:
    title: Büyük Beden Erkek Giyim
    text: Rahat, şık ve her tarza uygun
    cta: Erkek Bölümüne Git
    image:
      src: /images/ai/hero-erkek/hero-erkek.jpg
      alt: "Büyük beden erkek smart casual kombini: lacivert ceket, beyaz tişört, gri kumaş pantolon ve kahverengi deri ayakkabıyla Boğaz kıyısında"
      aiGenerated: true

name: IndexNow
# main'e yapılan her site yayınından sonra sitemap URL'lerini Bing/Yandex'e bildirir.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md", "legacy/**", "tests/**"]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Vercel yayınının bitmesini bekle
        run: sleep 240
      - run: node scripts/indexnow.mjs
